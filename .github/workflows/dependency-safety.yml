name: Dependency safety

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-check:
    name: Build and public smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://www.muhyotech.com
      NEXT_PUBLIC_BASE_URL: https://www.muhyotech.com
      APP_URL: https://www.muhyotech.com

    steps:
      - name: Check out proposed change
        uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create production build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify public pages
        run: npm run test:smoke

      - name: Preserve test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
