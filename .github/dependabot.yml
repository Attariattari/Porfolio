version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      nextjs-runtime:
        patterns:
          - next
          - react
          - react-dom
        update-types:
          - patch
          - minor
      safe-production-dependencies:
        dependency-type: production
        update-types:
          - patch
          - minor
      safe-development-dependencies:
        dependency-type: development
        update-types:
          - patch
          - minor
    ignore:
      # Major framework upgrades can require migrations and always need a
      # deliberately created, manually reviewed upgrade branch.
      - dependency-name: next
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major

